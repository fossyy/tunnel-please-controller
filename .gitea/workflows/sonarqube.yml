on:
  push:
    branches:
      - main
      - staging
      - 'feat/**'

name: SonarQube Scan
jobs:
  sonarqube:
    name: SonarQube Trigger
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tp
          POSTGRES_PASSWORD: tp
          POSTGRES_DB: tp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checking out
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 'stable'
          cache: false

      - name: Install dependencies
        run: go mod tidy

      - name: Install psql
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update && sudo apt-get install -y postgresql-client
          fi

      - name: Apply database migrations
        run: |
          for f in internal/db/sqlc/migrations/*.up.sql; do
            echo "applying $f"
            PGPASSWORD=tp psql -h 127.0.0.1 -U tp -d tp_test -v ON_ERROR_STOP=1 -f "$f"
          done

      - name: Run go vet
        run: go vet ./... 2>&1 | tee vet-results.txt

      - name: Run tests with coverage
        env:
          TP_TEST_DATABASE_URL: postgres://tp:tp@127.0.0.1:5432/tp_test
        run: |
          go test ./... -v -p 4 -coverprofile=coverage

      - name: Run GolangCI-Lint Analysis
        uses: golangci/golangci-lint-action@v9
        with:
          skip-cache: true
          version: latest
          args: >
            --issues-exit-code=0
            --output.text.path=stdout
            --output.checkstyle.path=golangci-lint-report.xml

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v8.5.0
        env:
          SONAR_HOST_URL: ${{ secrets.SONARQUBE_HOST }}
          SONAR_TOKEN: ${{ secrets.SONARQUBE_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=tunnel-please-controller
            -Dsonar.go.coverage.reportPaths=coverage
            -Dsonar.test.inclusions=**/*_test.go
            -Dsonar.test.exclusions=**/vendor/**
            -Dsonar.exclusions=**/*_test.go,**/vendor/**,**/golangci-lint-report.xml
            -Dsonar.go.govet.reportPaths=vet-results.txt
            -Dsonar.go.golangci-lint.reportPaths=golangci-lint-report.xml
            -Dsonar.sources=./
            -Dsonar.tests=./